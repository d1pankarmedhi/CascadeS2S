syntax = "proto3";
package voice;

service STTService {
    rpc TranscribeStream (stream AudioChunk) returns (stream STTEvent);
}

service LLMService {
    rpc GenerateStream (stream TextChunk) returns (stream LLMEvent);
}

service TTSService {
    rpc SynthesizeStream (stream TextChunk) returns (stream AudioChunk);
}

message AudioChunk {
    string session_id = 1;
    bytes data = 2;
    bool end_stream = 3;
    bool speech_started = 4;
}

message STTEvent {
    string session_id = 1;
    string text = 2;
    bool is_final = 3;
    bool interrupt = 4;
    bool restore_audio = 5;
    double stt_latency_ms = 6;
}

message TextChunk {
    string session_id = 1;
    string text = 2;
    bool end_stream = 3;
}

message LLMEvent {
    string session_id = 1;
    string text_chunk = 2;
    double llm_latency_ms = 3;
    bool stream_finished = 4;
}

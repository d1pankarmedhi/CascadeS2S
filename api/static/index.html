<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CascadeS2S - Live Voice Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <h1>CascadeS2S</h1>
            <p class="subtitle">AI Voice Assistant</p>
        </header>

        <main class="chat-container" id="transcript">
            <div class="placeholder">How can I help you today?</div>
        </main>

        <footer class="action-bar">
            <div class="action-bar-content" id="connectionStatus">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text" id="statusText">Disconnected</span>
                </div>

                <div class="controls">
                    <button class="btn-primary" id="startBtn">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                        </svg>
                        Start
                    </button>
                    <button class="btn-secondary hidden" id="stopBtn">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                        Stop
                    </button>
                    <button class="btn-clear" id="clearBtn">Clear</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Icons for status updates (hidden, used by JS) -->
    <div class="hidden">
        <svg id="micIcon">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        </svg>
        <svg id="processingIcon">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
        </svg>
        <svg id="speakingIcon">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <div id="statusIcon"></div> <!-- Dummy for JS -->
    </div>

    <script src="/static/app.js?v=3"></script>
</body>

</html>

[project]
description = "A distributed speech-to-speech system"
name = "CascadeS2S"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "fastapi[all]>=0.116.1",
  "google-genai>=1.31.0",
  "faster-whisper>=1.0.0",
  "redis>=6.4.0",
  "torch>=2.8.0",
  "uvicorn>=0.35.0",
  "websockets>=12.0",
  "webrtcvad>=2.0.10",
  "pydub>=0.25.1",
  "soundfile>=0.12.1",
  "python-multipart>=0.0.6",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu"},
]
torchvision = [
  {index = "pytorch-cpu"},
]
